<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 212" width="1000" height="212" role="img" aria-label="Three proportions. Test coverage 88 percent, up from 74.7. 53 percent of every pull request touched belonged to someone else: 906 reviews against 798 of my own. 89 percent of pull requests opened were merged: 707 of 798.">
<defs><clipPath id="rgdark"><rect x="0" y="0" width="1000" height="212" rx="10"/></clipPath></defs>
<style>.lb{opacity:0;animation:fa .5s ease forwards}@keyframes fa{to{opacity:1}}.a0{stroke-dasharray:289.0;stroke-dashoffset:289.0;animation:k0 1.15s cubic-bezier(.25,.9,.3,1) 0.25s forwards}@keyframes k0{to{stroke-dashoffset:34.7}}.a1{stroke-dasharray:289.0;stroke-dashoffset:289.0;animation:k1 1.15s cubic-bezier(.25,.9,.3,1) 0.41s forwards}@keyframes k1{to{stroke-dashoffset:135.8}}.a2{stroke-dasharray:289.0;stroke-dashoffset:289.0;animation:k2 1.15s cubic-bezier(.25,.9,.3,1) 0.57s forwards}@keyframes k2{to{stroke-dashoffset:31.8}}@media (prefers-reduced-motion: reduce){.lb{opacity:1;animation:none}.a0{stroke-dashoffset:34.7;animation:none}.a1{stroke-dashoffset:135.8;animation:none}.a2{stroke-dashoffset:31.8;animation:none}}</style>
<g clip-path="url(#rgdark)">
<rect x="0" y="0" width="1000" height="212" fill="#141C23"/>
<g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<circle cx="190" cy="86" r="46.0" fill="none" stroke="#1E2932" stroke-width="11"/>
<circle class="a0" cx="190" cy="86" r="46.0" fill="none" stroke="#56AEC2" stroke-width="11" stroke-linecap="round" transform="rotate(-90 190 86)"/>
<text x="190" y="96" font-size="30" font-weight="700" fill="#E8EEF2" text-anchor="middle" letter-spacing="-1">88%</text>
<text class="lb" style="animation-delay:0.70s" x="190" y="170" font-size="12" font-weight="700" fill="#94A3AE" text-anchor="middle" letter-spacing="1.5">TEST COVERAGE</text>
<text class="lb" style="animation-delay:0.78s" x="190" y="189" font-size="12" fill="#6B7783" text-anchor="middle">core service, up from 74.7%</text>
<circle cx="500" cy="86" r="46.0" fill="none" stroke="#1E2932" stroke-width="11"/>
<circle class="a1" cx="500" cy="86" r="46.0" fill="none" stroke="#56AEC2" stroke-width="11" stroke-linecap="round" transform="rotate(-90 500 86)"/>
<text x="500" y="96" font-size="30" font-weight="700" fill="#E8EEF2" text-anchor="middle" letter-spacing="-1">53%</text>
<text class="lb" style="animation-delay:0.82s" x="500" y="170" font-size="12" font-weight="700" fill="#94A3AE" text-anchor="middle" letter-spacing="1.5">OF EVERY PR I TOUCHED</text>
<text class="lb" style="animation-delay:0.90s" x="500" y="189" font-size="12" fill="#6B7783" text-anchor="middle">906 reviews against 798 of my own</text>
<circle cx="810" cy="86" r="46.0" fill="none" stroke="#1E2932" stroke-width="11"/>
<circle class="a2" cx="810" cy="86" r="46.0" fill="none" stroke="#56AEC2" stroke-width="11" stroke-linecap="round" transform="rotate(-90 810 86)"/>
<text x="810" y="96" font-size="30" font-weight="700" fill="#E8EEF2" text-anchor="middle" letter-spacing="-1">89%</text>
<text class="lb" style="animation-delay:0.94s" x="810" y="170" font-size="12" font-weight="700" fill="#94A3AE" text-anchor="middle" letter-spacing="1.5">PULL REQUESTS MERGED</text>
<text class="lb" style="animation-delay:1.02s" x="810" y="189" font-size="12" fill="#6B7783" text-anchor="middle">707 merged of 798 opened</text>
</g></g></svg>
