<text class="ln" style="animation-delay:2.19s" x="44" y="435" fill="#94A3AE" font-weight="400">&#160;&#160;&#160;├─ industries</text>
<text class="ln" style="animation-delay:2.23s" x="380" y="435" font-size="12.5" fill="#6B7783">capital markets · banking · insurance · government · e-commerce</text>
