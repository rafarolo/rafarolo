<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 656" width="1000" height="656" role="img" aria-label="Timeline of selected work. 2025–2026 OpenSec, an API for partners: 22 endpoints across 8 service families · documentation kits built by an automated pipeline; 2025–2026 Passwordless, and routes that stay inside: Entra ID workload identities on SQL Server and Postgres · service-to-service traffic on cluster-internal DNS; 2024–2026 New cluster, new region, one pipeline: every application rewritten into a single GitHub Actions pipeline · Azure subscription and AKS migration; 2023–2026 Kotlin as the platform language: off Python, JavaScript and TypeScript · hexagonal architecture · R$130B+ in issued assets; 2021–2023 Open Banking, certified: every BACEN and FEBRABAN phase through Raidiam conformance · insurance home in a 22M-customer bank app; 2020–2021 Claims analytics on GCP: predictive engine for suspicious claims at a 7M-client insurer, beside a COBOL/CICS core; 2019–2020 WebSphere to Kubernetes: retail insurance systems onto Liberty on IBM Cloud Private, OpenShift pipeline; 2014–2015 A study area, ten times faster: found the data bottleneck in a geomarketing platform's core calculation">
